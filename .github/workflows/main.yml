name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd drama_downloader_starter
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build exe
        run: |
          cd drama_downloader_starter
          pyinstaller launcher/windows_launcher.py -n DramaSearchAssistant
      - name: Copy all source folders
        run: |
          cd drama_downloader_starter
          xcopy app dist\DramaSearchAssistant\app /E /I /H /Y
          xcopy config dist\DramaSearchAssistant\config /E /I /H /Y
          xcopy data dist\DramaSearchAssistant\data /E /I /H /Y
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DramaSearchAssistant-Windows
          path: drama_downloader_starter/dist/DramaSearchAssistant
          
