name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "drama_downloader_starter/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: drama_downloader_starter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        working-directory: drama_downloader_starter
        run: |
          pyinstaller --noconfirm --clean --onefile --name DramaSearchAssistant launcher/windows_launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v5
        with:
          name: DramaSearchAssistant-Windows
          path: drama_downloader_starter/dist/DramaSearchAssistant.exe
          
